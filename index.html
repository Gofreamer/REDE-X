<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Rede Global</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23f58529'/%3E%3Cstop offset='.5' stop-color='%23dd2a7b'/%3E%3Cstop offset='1' stop-color='%238135a2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0c'/%3E%3Crect x='6' y='6' width='20' height='20' rx='6' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>
  <!-- AUTH -->
  <div id="auth-screen" class="auth">
    <div class="auth-bg"></div>
    <div class="auth-card">
      <div class="brand-block">
        <div class="logo-ring"><span>RG</span></div>
        <h1>Rede Global</h1>
        <p>A cidade em imagens. Fama, rumor e sinal aberto.</p>
      </div>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Entrar</button>
        <button type="button" class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Criar conta</button>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <label class="field"><span>E-mail</span>
          <input type="email" id="login-email" required placeholder="player@rede.global"/>
        </label>
        <label class="field"><span>Senha</span>
          <input type="password" id="login-password" required minlength="6"/>
        </label>
        <p class="error" id="login-error"></p>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Entrar</button>
      </form>
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <label class="field"><span>Nome</span>
          <input type="text" id="register-name" required maxlength="40" placeholder="Wei-Hayasaka Xing"/>
        </label>
        <label class="field"><span>Handle</span>
          <input type="text" id="register-handle" required maxlength="24" placeholder="wei_xing"/>
        </label>
        <label class="field"><span>E-mail</span>
          <input type="email" id="register-email" required placeholder="player@rede.global"/>
        </label>
        <label class="field"><span>Senha</span>
          <input type="password" id="register-password" required minlength="6"/>
        </label>
        <p class="error" id="register-error"></p>
        <button type="submit" class="btn btn-primary btn-block" id="btn-register">Criar conta</button>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app hidden">
    <!-- Sidebar desktop (Instagram PC) -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-ring sm"><span>RG</span></div>
        <span class="sidebar-logo-text">Rede Global</span>
      </div>
      <nav class="sidebar-nav">
        <button type="button" class="side-link active" data-view="feed" onclick="showView('feed')">
          <span class="side-ico">⌂</span><span class="side-label">Página inicial</span>
        </button>
        <button type="button" class="side-link" onclick="openCompose()">
          <span class="side-ico">＋</span><span class="side-label">Criar</span>
        </button>
        <button type="button" class="side-link" onclick="openSearch()">
          <span class="side-ico">⌕</span><span class="side-label">Pesquisar</span>
        </button>
        <button type="button" class="side-link" data-view="profile" onclick="goMyProfile()">
          <span class="side-ico">◎</span><span class="side-label">Perfil</span>
        </button>
        <button type="button" class="side-link admin-only hidden" data-view="admin" onclick="showView('admin')">
          <span class="side-ico">✦</span><span class="side-label">Admin</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="side-user">
          <span id="chrome-handle" class="chrome-handle">@</span>
        </div>
        <button type="button" class="side-link side-more" onclick="handleLogout()">
          <span class="side-ico">☰</span><span class="side-label">Sair</span>
        </button>
      </div>
    </aside>

    <!-- Coluna central -->
    <div class="center-col">
      <header class="mobile-topbar">
        <span class="topbar-title">Rede Global</span>
        <button type="button" class="icon-btn" onclick="openCompose()" title="Criar">＋</button>
      </header>

      <main class="shell">
        <section id="view-feed" class="view">
          <div id="stories" class="stories"></div>
          <div id="feed" class="feed"></div>
        </section>
        <section id="view-profile" class="view hidden">
          <div id="profile-root"></div>
        </section>
        <section id="view-admin" class="view hidden">
          <div id="admin-root"></div>
        </section>
      </main>
    </div>

    <!-- Painel direito desktop -->
    <aside class="right-rail" id="right-rail">
      <div class="rail-me" id="rail-me"></div>
      <div class="rail-block">
        <div class="rail-head">
          <span>No ar na cidade</span>
        </div>
        <div id="rail-suggestions" class="rail-list"></div>
      </div>
      <p class="rail-footer">Rede Global · in-world · mesa RPG</p>
    </aside>

    <!-- Tab bar mobile -->
    <nav class="tabbar">
      <button type="button" class="tab-btn active" data-view="feed" onclick="showView('feed')">
        <span class="tab-ico">⌂</span>
      </button>
      <button type="button" class="tab-btn" onclick="openCompose()">
        <span class="tab-ico tab-plus">＋</span>
      </button>
      <button type="button" class="tab-btn" onclick="openSearch()">
        <span class="tab-ico">⌕</span>
      </button>
      <button type="button" class="tab-btn" data-view="profile" onclick="goMyProfile()">
        <span class="tab-ico">◎</span>
      </button>
      <button type="button" class="tab-btn admin-only hidden" data-view="admin" onclick="showView('admin')">
        <span class="tab-ico">✦</span>
      </button>
    </nav>
  </div>

  <!-- Compose -->
  <div id="compose-modal" class="modal" onclick="if(event.target===this)closeCompose()">
    <div class="modal-sheet compose-sheet">
      <div class="sheet-head">
        <h3>Nova publicação</h3>
        <button type="button" class="icon-btn" onclick="closeCompose()">✕</button>
      </div>
      <form id="compose-form" onsubmit="submitCompose(event)">
        <div id="compose-preview" class="compose-preview"><span class="text-muted">Prévia da imagem</span></div>
        <label class="field"><span>URL da imagem</span>
          <input type="url" id="compose-image" required placeholder="https://…" oninput="previewComposeImage()"/>
        </label>
        <label class="field"><span>Legenda</span>
          <textarea id="compose-caption" rows="3" maxlength="500" placeholder="O que está rolando na cidade?"></textarea>
        </label>
        <div class="admin-only hidden">
          <label class="field"><span>Postar como handle (admin)</span>
            <input type="text" id="compose-as" placeholder="vazio = você"/>
          </label>
          <label class="field"><span>Nome de exibição</span>
            <input type="text" id="compose-as-name" placeholder="Nina Riders"/>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Compartilhar</button>
      </form>
    </div>
  </div>

  <!-- Post detail -->
  <div id="post-modal" class="modal" onclick="if(event.target===this)closePostModal()">
    <div class="modal-sheet post-sheet">
      <div id="post-modal-body"></div>
    </div>
  </div>

  <!-- Story view -->
  <div id="story-modal" class="modal story-layer" onclick="if(event.target===this)closeStory()">
    <div id="story-modal-body"></div>
  </div>

  <!-- Story compose -->
  <div id="story-compose-modal" class="modal" onclick="if(event.target===this)closeStoryCompose()">
    <div class="modal-sheet">
      <div class="sheet-head">
        <h3>Novo story</h3>
        <button type="button" class="icon-btn" onclick="closeStoryCompose()">✕</button>
      </div>
      <form onsubmit="submitStory(event)">
        <label class="field"><span>Handle</span>
          <input class="input" id="story-handle" placeholder="porto_wire"/>
        </label>
        <label class="field"><span>Nome</span>
          <input class="input" id="story-name" placeholder="Porto Wire"/>
        </label>
        <label class="field"><span>Imagem URL</span>
          <input class="input" id="story-image" type="url" required/>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Publicar story</button>
      </form>
    </div>
  </div>

    <div id="search-modal" class="modal" onclick="if(event.target===this)closeSearch()">
    <div class="modal-sheet">
      <div class="sheet-head">
        <h3>Pesquisar</h3>
        <button type="button" class="icon-btn" onclick="closeSearch()">✕</button>
      </div>
      <input type="search" id="search-input" class="input" placeholder="Buscar @handle ou nome" oninput="onSearchInput()" autocomplete="off"/>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script src="./js/config/firebase-config.js"></script>
  <script src="./js/data/state.js"></script>
  <script src="./js/core/utils.js"></script>
  <script src="./js/services/auth.js"></script>
  <script src="./js/services/database.js"></script>
  <script src="./js/features/feed.js"></script>
  <script src="./js/features/compose.js"></script>
  <script src="./js/features/search.js"></script>
  <script src="./js/features/profile.js"></script>
    <script src="./js/features/admin.js"></script>
  <script src="./js/app/navigation.js"></script>
  <script src="./js/app/start.js"></script>
  <script type="module" src="./js/features/firebase-ai.js"></script>
</body>
</html>
