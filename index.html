<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rede X</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090b10'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui' font-weight='700' font-size='14' fill='%23a78bfa'%3EX%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>
  <!-- AUTH -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo-mark">X</div>
        <h1>Rede X</h1>
        <p>O fio da cidade. Rumores, mídia e sinal aberto.</p>
      </div>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Entrar</button>
        <button type="button" class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Criar conta</button>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="login-email" class="input" required placeholder="player@rede.rpg"/>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="login-password" class="input" required minlength="6"/>
        </div>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn btn-primary btn-full" id="btn-login">Entrar</button>
      </form>
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="register-name" class="input" required maxlength="40" placeholder="Wei-Hayasaka Xing"/>
        </div>
        <div class="form-group">
          <label>Handle (@)</label>
          <input type="text" id="register-handle" class="input" required maxlength="24" placeholder="wei_xing"/>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="register-email" class="input" required placeholder="player@rede.rpg"/>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="register-password" class="input" required minlength="6"/>
        </div>
        <p class="form-error" id="register-error"></p>
        <button type="submit" class="btn btn-primary btn-full" id="btn-register">Criar conta</button>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app hidden">
    <header class="header">
      <div class="header-left">
        <div class="logo-mark small">X</div>
        <span class="brand">Rede X</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="home" onclick="showView('home')">Fio</button>
        <button class="nav-item" data-view="profile" onclick="showView('profile')">Perfil</button>
        <button class="nav-item admin-only hidden" data-view="admin" onclick="showView('admin')">Admin</button>
      </nav>
      <div class="header-right">
        <span id="header-user" class="header-handle"></span>
        <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Sair</button>
      </div>
    </header>

    <main class="main">
      <section id="view-home" class="view">
        <div id="composer" class="composer-wrap"></div>
        <div id="timeline" class="timeline"></div>
      </section>

      <section id="view-profile" class="view hidden">
        <div id="profile-root"></div>
      </section>

      <section id="view-admin" class="view hidden">
        <div id="admin-root"></div>
      </section>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script src="./js/config/firebase-config.js"></script>
  <script src="./js/data/state.js"></script>
  <script src="./js/core/utils.js"></script>
  <script src="./js/services/auth.js"></script>
  <script src="./js/services/database.js"></script>
  <script src="./js/features/timeline.js"></script>
  <script src="./js/features/profile.js"></script>
  <script src="./js/features/admin.js"></script>
  <script src="./js/app/navigation.js"></script>
  <script src="./js/app/start.js"></script>
</body>
</html>
